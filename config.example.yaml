# Embolt config. Every key has a default; only upstream.url and at least one
# node source are required. The file reloads on change or SIGHUP.

upstream:
  url: https://emby.example.com:443
  # redirect: follow        # follow a 302 to a cloud drive inside the proxy, or "pass" it to the player

# Node sources use mihomo's own schema, so these blocks paste unchanged.
proxy-providers:
  main:
    type: http
    url: https://provider.example/sub?token=REPLACE_ME
    interval: 21600         # seconds
    exclude-filter: '(?:流量|到期|官网|客服|公告|重置)'

# dns:                      # resolves node servers; mihomo's schema, other keys ignored;
#                           # changes apply after a restart.
#   default-nameserver:     # IPs only: they resolve the servers below
#     - tls://223.5.5.5
#   proxy-server-nameserver:
#     - https://dns.alidns.com/dns-query
#     - https://doh.pub/dns-query
#   ipv6: false             # without a dns section, the OS's servers are used

# proxies:                  # inline nodes, also mihomo's schema
#   - {name: home, type: direct}

# pins:                     # node name or ID; overrides the controller
#   primary: ""
#   media: ""

# control:
